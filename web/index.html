<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find meeting times across local working hours and time zone changes.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meeting Window">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Meeting Window</title>
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(async (registrations) => {
        const scope = new URL('./', document.baseURI).href;
        const old = registrations.filter((registration) => registration.scope === scope);
        if (!old.length) return;
        await Promise.all(old.map((registration) => registration.unregister()));
        if (navigator.serviceWorker.controller) window.location.reload();
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=2" async></script>
</body>
</html>
